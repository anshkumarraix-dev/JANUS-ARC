[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "janus-mcp"
version = "0.1.0"
description = "JANUS-ARC — Non-Clinical Caregiver Synchronization FastMCP Server for Alexa+"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Janus Developer Team" }
]
dependencies = [
    "mcp>=1.30.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/anshkumarraix-dev/JANUS-ARC"
Repository = "https://github.com/anshkumarraix-dev/JANUS-ARC.git"
Issues = "https://github.com/anshkumarraix-dev/JANUS-ARC/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "jsonschema>=4.20.0",
    "flake8>=7.0.0",
]

[project.scripts]
janus-server = "janus.server:main"
janus-audit = "janus.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["janus"]
branch = true

[tool.coverage.report]
show_missing = true
