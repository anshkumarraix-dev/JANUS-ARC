[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "janus-mcp"
version = "0.1.0"
description = "Janus (ElderSync) — Non-Clinical Caregiver Synchronization FastMCP Server for Alexa+"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Janus Developer Team" }
]
dependencies = [
    "mcp>=1.30.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "flake8>=7.0.0",
]

[project.scripts]
janus-server = "janus.server:main"

[tool.setuptools.packages.find]
where = ["src"]
